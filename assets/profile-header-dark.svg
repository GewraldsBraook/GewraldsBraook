<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gewralds Braook — Backend .NET Engineer</title>
  <desc id="desc">Aviation operations console showing a route between API, domain, events, and data systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1726"/>
      <stop offset="1" stop-color="#071522"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.48" r="0.48">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity="0.055"/>
    </pattern>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame"><rect x="2" y="2" width="1196" height="356" rx="26"/></clipPath>
    <path id="flightPath" d="M742 274 C804 216 851 232 890 180 S982 83 1095 116"/>
    <style>
      .label { font-family: Consolas, 'Courier New', monospace; letter-spacing: 2px; }
      .sans { font-family: 'Segoe UI', Arial, sans-serif; }
      .intro { animation: reveal .7s ease-out both; }
      .delay1 { animation-delay: .14s; }
      .delay2 { animation-delay: .28s; }
      .route { stroke-dasharray: 9 13; animation: route 2.8s ease-out both; }
      .ping { transform-box: fill-box; transform-origin: center; animation: ping 1.5s ease-out 1.6s both; }
      .online { animation: online 1.8s ease-out 1.1s both; }
      @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes route { from { stroke-dashoffset: 160; opacity: .2; } to { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes ping { 0% { opacity: 0; transform: scale(.4); } 45% { opacity: .8; } 100% { opacity: 0; transform: scale(2.4); } }
      @keyframes online { 0%, 35% { opacity: .35; } 55% { opacity: 1; } 75% { opacity: .45; } 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <circle cx="960" cy="174" r="170" fill="#0ea5e9" opacity="0.035"/>
    <circle cx="960" cy="174" r="122" fill="none" stroke="#7dd3fc" stroke-opacity="0.08"/>
    <circle cx="960" cy="174" r="78" fill="none" stroke="#7dd3fc" stroke-opacity="0.07"/>
    <path d="M960 24V324M810 174H1110" stroke="#7dd3fc" stroke-opacity="0.045"/>

    <g class="intro">
      <circle cx="67" cy="48" r="4" fill="#5eebff" filter="url(#cyanGlow)"/>
      <text x="82" y="53" class="label" fill="#83dff2" font-size="12">PROFILE / GB-01</text>
    </g>
    <g class="online">
      <circle cx="1008" cy="49" r="4" fill="#6ee7b7" filter="url(#cyanGlow)"/>
      <text x="1020" y="53" class="label" fill="#9cebcf" font-size="11">SYSTEMS ONLINE</text>
    </g>

    <g class="intro delay1">
      <text x="65" y="137" class="sans" fill="#f2f7ff" font-size="47" font-weight="750" letter-spacing="1">GEWRALDS BRAOOK</text>
      <text x="68" y="179" class="label" fill="#5eebff" font-size="20" font-weight="700">BACKEND .NET ENGINEER</text>
    </g>
    <g class="intro delay2">
      <text x="68" y="218" class="sans" fill="#a9b9cd" font-size="16">Reliable systems for aviation technology</text>
      <path d="M68 238H532" stroke="#18364a"/>
      <text x="68" y="269" class="label" fill="#d3deeb" font-size="11">AVIATION TECH</text>
      <circle cx="185" cy="265" r="2" fill="#f5a623"/>
      <text x="203" y="269" class="label" fill="#d3deeb" font-size="11">DISTRIBUTED SYSTEMS</text>
      <circle cx="364" cy="265" r="2" fill="#f5a623"/>
      <text x="382" y="269" class="label" fill="#d3deeb" font-size="11">CLOUD INTEGRATIONS</text>
    </g>

    <g>
      <path d="M742 274 C804 216 851 232 890 180 S982 83 1095 116" fill="none" stroke="#10354d" stroke-width="5" opacity=".8"/>
      <use href="#flightPath" fill="none" stroke="#5eebff" stroke-width="2" class="route"/>

      <g fill="#07111f" stroke="#5eebff" stroke-width="2">
        <circle cx="742" cy="274" r="7"/><circle cx="890" cy="180" r="7"/><circle cx="1095" cy="116" r="7"/>
      </g>
      <g fill="#5eebff">
        <circle cx="742" cy="274" r="2.5"/><circle cx="890" cy="180" r="2.5"/><circle cx="1095" cy="116" r="2.5"/>
      </g>
      <circle cx="1095" cy="116" r="9" fill="none" stroke="#5eebff" stroke-width="2" class="ping"/>

      <g class="label" font-size="10" fill="#9cb2c8">
        <text x="716" y="302">API / 01</text>
        <text x="858" y="207">DOMAIN / 02</text>
        <text x="1052" y="92">EVENTS / 03</text>
      </g>

      <g filter="url(#cyanGlow)">
        <path d="M-10 -5L12 0-10 5-5 0Z" fill="#f2f7ff">
          <animateMotion dur="4.2s" repeatCount="1" fill="freeze" rotate="auto"><mpath href="#flightPath"/></animateMotion>
        </path>
      </g>
      <text x="867" y="316" class="label" fill="#55748c" font-size="10">C# / AZURE / RABBITMQ / SQL</text>
    </g>

    <path d="M0 320H640L690 360H0Z" fill="#081a2a" opacity=".72"/>
    <text x="67" y="333" class="label" fill="#5f8099" font-size="10">MANIZALES, COLOMBIA</text>
    <text x="245" y="333" class="label" fill="#5f8099" font-size="10">COT / UTC-5</text>
  </g>
  <rect x="2" y="2" width="1196" height="356" rx="26" fill="none" stroke="#17354a" stroke-width="2"/>
</svg>
